[env]
_.file = { path = ".env" }
_.path = ["{{config_root}}/node_modules/.bin", "{{cwd}}/node_modules/.bin"]

[settings]
auto_install = false
experimental = true
lockfile = true
cargo.binstall = true

[tools]
"cargo:selene" = "latest"
"cargo:run-in-roblox" = "latest"
"github:JohnnyMorganz/wally-package-types" = "latest"
"github:UpliftGames/wally" = "latest"
"github:johnnymorganz/luau-lsp" = "latest"
"github:lune-org/lune" = "latest"
"github:rojo-rbx/rojo" = "latest"
luau = "latest"
