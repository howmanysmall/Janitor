[env]
_.file = { path = ".env" }
_.path = ["{{config_root}}/node_modules/.bin", "{{cwd}}/node_modules/.bin"]
HK_MISE = 1

[settings]
auto_install = false
experimental = true
lockfile = true
cargo.binstall = true

[tools]
"cargo:selene" = "latest"
"cargo:run-in-roblox" = "latest"
"github:JohnnyMorganz/wally-package-types" = "latest"
"github:UpliftGames/wally" = "latest"
"github:johnnymorganz/luau-lsp" = "latest"
"github:lune-org/lune" = "latest"
"github:rojo-rbx/rojo" = "latest"
luau = "latest"
ni = "latest"
pnpm = "11.17.0"
actionlint = "latest"
betterleaks = "latest"
hk = "1.50.0"
node = "26"
pinact = "latest"
pkl = "latest"
rumdl = "latest"
shellcheck = "latest"
shfmt = "latest"
tombi = "latest"
vale = "latest"
zizmor = "latest"
